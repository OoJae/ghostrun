# The outside uptime check: from GitHub's machines, not Cloudflare's, so an outage of the edge
# itself is still seen. Every 30 minutes it loads the app and /v1/health on production; a failed run
# emails the repo owner (GitHub's default for scheduled workflows), and posts to ntfy when the
# NTFY_TOPIC secret is set.
name: uptime
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: App and health respond
        env:
          BASE: https://play.ghostrun.workers.dev
        run: |
          set -eu
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/")
          echo "app: $code"; test "$code" = 200
          health=$(curl -s --max-time 20 "$BASE/v1/health")
          echo "health: $health"
          echo "$health" | grep -q '"ok":true'
          echo "$health" | grep -q '"llm":true'
          echo "$health" | grep -q '"gate":"turnstile"'
      - name: Alert
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -n "${NTFY_TOPIC:-}" ]; then
            curl -s -H "Title: GHOSTRUN is down" -d "The uptime check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" "https://ntfy.sh/$NTFY_TOPIC" >/dev/null
          fi
